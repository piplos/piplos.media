# API-only stack — images from ghcr.io/piplos/piplos-{api,migrate}:latest
#
#   cp .env.example .env   # set secrets
#   ./deploy.sh
#
# Migrations run automatically on `up` (one-shot `migrate` → api starts after success).
# Manual goose: docker compose run --rm migrate status|down
#
# Requires Safeline on external network `safeline-ce`. Only `api` is attached
# (static IPv4, tunable via SAFELINE_IPV4 in `.env`). Point Safeline upstream to that IP:3001.
name: piplos

networks:
  safeline-ce:
    external: true
  internal:

volumes:
  pgdata: {}
  uploads: {}
  backups: {}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20M"
    max-file: "10"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *hardening
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piplos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-piplos}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - internal
    logging: *default-logging

  migrate:
    image: ghcr.io/piplos/piplos-migrate:latest
    restart: "no"
    <<: *hardening
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-piplos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-piplos}?sslmode=${POSTGRES_SSLMODE:-disable}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  api:
    image: ghcr.io/piplos/piplos-api:latest
    restart: unless-stopped
    init: true
    <<: *hardening
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://${POSTGRES_USER:-piplos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-piplos}?sslmode=${POSTGRES_SSLMODE:-disable}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_HOURS: ${JWT_REFRESH_EXPIRATION_HOURS:-168}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://piplos.media}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
      PUBLIC_API_URL: https://api.${BASE_DOMAIN}
    volumes:
      # - uploads:/app/data/uploads
      - ./data:/app/data
      - backups:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging

  # Rewrites /api/v1/* → /v1/* for admin on Cloudflare (expects /api/v1 prefix).
  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *hardening
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./docker/api-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:3001"
    networks:
      internal: {}
      safeline-ce:
        ipv4_address: ${SAFELINE_IPV4:-172.22.222.104}
    logging: *default-logging
