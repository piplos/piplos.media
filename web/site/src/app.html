<!doctype html>
<html lang="en" data-theme="dark" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#24252a" id="theme-color-meta" />
		<link
			rel="preload"
			href="/fonts/TermitoHeavyCaps/termito_heavy-webfont.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/inter/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<script>
			(function() {
				var saved = localStorage.getItem('piplos-theme');
				var preferred = (saved === 'light' || saved === 'dark') ? saved : 'dark';
				document.documentElement.setAttribute('data-theme', preferred);
				var meta = document.getElementById('theme-color-meta');
				if (meta) meta.content = preferred === 'light' ? '#ffffff' : '#24252a';
			})();
		</script>
		<!-- Google Analytics: load after page is idle to keep LCP/TBT clean -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			(function() {
				function loadGtag() {
					if (window.__gtagLoaded) return;
					window.__gtagLoaded = true;
					var s = document.createElement('script');
					s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VDNME4G2S7';
					s.async = true;
					s.onload = function() {
						gtag('js', new Date());
						gtag('config', 'G-VDNME4G2S7');
					};
					document.head.appendChild(s);
				}
				if ('requestIdleCallback' in window) {
					requestIdleCallback(loadGtag, { timeout: 4000 });
				} else {
					window.addEventListener('load', function() {
						setTimeout(loadGtag, 1);
					});
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a href="#main" class="skip">Skip to main content</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
